[package]
name = "db"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.9", features = [ "runtime-tokio", "postgres", "json", "chrono" ] }
tracing = "0.1"
polars = { version = "0.55", features = ["json"] }
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[features]
db_tests = []